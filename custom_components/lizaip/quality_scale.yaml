# Integration Quality Scale — Platinum
# https://developers.home-assistant.io/docs/integration_quality_scale_index/
rules:
  # Bronze
  action-setup:
    status: done
    comment: Services registered in async_setup via async_register_services.
  appropriate-polling:
    status: exempt
    comment: iot_class is local_push — device connects to HA, no polling.
  brands:
    status: todo
    comment: >
      Not submitted to home-assistant/brands yet. brands.home-assistant.io/_/lizaip/
      answers 200 with the "icon not available" placeholder, which is the repository
      saying it does not have us rather than that it does. custom_components/lizaip/brand/
      holds icon.png, logo.png and dark_logo.png ready for that PR.
  common-modules:
    status: done
    comment: Uses config_entry_only_config_schema, DeviceInfo, AddEntitiesCallback, etc.
  config-flow:
    status: done
    comment: Zeroconf and WebSocket discovery flows.
  config-flow-test-coverage:
    status: done
    comment: >
      tests/test_config_flow.py covers zeroconf (new/already-configured/re-discovery),
      websocket, confirm, user (abort), and reconfigure steps.
  dependency-transparency:
    status: done
    comment: No third-party PyPI requirements.
  docs-actions:
    status: done
    comment: send_image service documented in README.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-installation-parameters:
    status: done
    comment: >
      README "Settings" table covers every option the config and options flows
      offer -- device language, optimistic updates, slider update interval, and
      demo mode with its two timings -- with defaults and what each one costs.
  docs-removal-instructions:
    status: done
  entity-event-setup:
    status: done
    comment: Callbacks registered in async_added_to_hass, removed in async_will_remove_from_hass.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
    comment: Uses entry.runtime_data with typed LizaIPConfigEntry.
  test-before-configure:
    status: exempt
    comment: Push-model integration — device connects to HA, not the other way.
  test-before-setup:
    status: exempt
    comment: Push-model integration — device initiates the WebSocket connection.
  unique-config-entry:
    status: done
    comment: async_set_unique_id + _abort_if_unique_id_configured in config flow.

  # Silver
  config-entry-unloading:
    status: done
    comment: async_unload_entry disconnects WebSocket and unloads platforms.
  diagnostics:
    status: done
    comment: diagnostics.py exposes connection state, protocol version, capabilities.
  discovery:
    status: done
    comment: Zeroconf _lizaip._tcp and WebSocket-based discovery.
  docs-data-update:
    status: done
    comment: README documents local-push WebSocket model.
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: done
    comment: Documented in README (entities, actions, page management).
  dynamic-devices:
    status: exempt
    comment: One device per config entry; device is created/removed with the entry.
  entity-category:
    status: done
    comment: Brightness=CONFIG, Battery=DIAGNOSTIC.
  entity-unavailable:
    status: done
    comment: >
      LizaIPEntity.available follows connection.connected, and register_availability
      writes state on every transition, so all platforms go unavailable together
      when the device disconnects. Two deliberate departures: Brightness is also
      unavailable while the device is in automatic mode, since an edit would be
      overwritten; and the firmware Update entity stays available because its
      version check queries the release server rather than the device -- installing
      while disconnected is refused by async_install with a translated
      ServiceValidationError.
  entity-disabled-by-default:
    status: exempt
    comment: All entities are essential — no non-critical entities to disable.
  exception-translations:
    status: done
    comment: ServiceValidationError uses translation_domain/translation_key.
  icon-translations:
    status: done
    comment: icons.json provides entity and service icons.
  integration-owner:
    status: done
    comment: codeowners set in manifest.json.
  log-when-unavailable:
    status: done
    comment: Logs at warning level when device WebSocket disconnects.
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES set in all platform modules.
  reconfiguration-flow:
    status: done
    comment: async_step_reconfigure allows renaming the device.
  repair-issues:
    status: done
    comment: >
      Protocol version mismatch and repeated connection failures (≥3 consecutive)
      are surfaced as HA repair issues via homeassistant.helpers.issue_registry.
  stale-devices:
    status: exempt
    comment: One device per config entry — no sub-devices that can go stale.

  # Gold
  action-exceptions:
    status: done
    comment: send_image raises ServiceValidationError for all failure modes.
  devices:
    status: done
    comment: async_get_or_create with identifiers, manufacturer, model, sw_version.
  discovery-update-info:
    status: done
    comment: Zeroconf re-discovery updates sw_version in config entry and device registry.
  docs-configuration-parameters:
    status: done
    comment: README documents stored config parameters.
  docs-conditions:
    status: exempt
    comment: The integration registers no conditions.
  docs-triggers:
    status: exempt
    comment: >
      The integration registers no triggers. Button presses surface as event
      entities, which automations subscribe to through the standard state
      trigger rather than through one of ours.
  docs-examples:
    status: done
    comment: README includes automation and action YAML examples.
  entity-device-class:
    status: done
    comment: Battery sensor uses SensorDeviceClass.BATTERY.
  entity-translations:
    status: done
    comment: All entities use translation_key with placeholders in strings.json.
  reauthentication-flow:
    status: exempt
    comment: >
      No user credentials involved — the device connects with a bearer-token-free
      WebSocket per PROTOCOL.md (no application-layer auth defined in this protocol
      version), so there is no credential to re-authenticate.
  strict-typing:
    status: done
    comment: py.typed marker present; full type annotations across protocol and connection modules.

  # Platinum
  async-dependency:
    status: exempt
    comment: No third-party async PyPI dependencies — only aiohttp (bundled with HA).
  inject-websession:
    status: done
    comment: aiohttp ClientSession obtained via async_get_clientsession in config flow.
  test-coverage:
    status: done
    comment: >
      The suite covers every integration module -- connection, protocol, entities,
      diagnostics, services, config flow, the WSS certificate helper, the config
      panel's websocket API and its JavaScript, and the imgserv rendering and HTTP
      layer. Run it with `make test`, or `IMGSERV_SKIP_HTTP=1 pytest tests/` without
      a live Home Assistant: that mode skips the reference-image regression tests,
      which render against a running imgserv. See tests/README.md.
      Deliberately not stating a count here -- the number this comment carried was
      wrong by an order of magnitude before tests/test_quality_scale.py existed to
      notice, and a figure no one verifies is worse than no figure.

