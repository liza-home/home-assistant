# Amazon Fire TV Template — pre-configured remote control
#
# The remote page follows the LG webOS TV template: the arrow keys around OK,
# Home below them, and the TV's further pages on the right-hand column --
# Apps (button 4), Digits (button 8) and Inputs (button 12) where the TV has
# them. They are subpages: not in the remote's page order, only reached from
# those buttons; on each, the remote's Back button leads back.
#   - Apps: the apps the integration lists as the media player's sources,
#     each opening with `media_player.select_source`; more than twelve get
#     more Apps pages, button 12 leading on.
#   - Digits: 1–9 and 0 as on a phone keypad, with Channel up and down.
#   A Fire TV lists no inputs, so there is no Inputs page; button 12 is empty.

# Keys go through the Android Debug Bridge integration's `remote.send_command`,
# which knows the names in its own key table (UP, CENTER, MENU, REWIND, …)
# and sends anything else to the device as a shell command -- which is how
# the keys missing from that table (play/pause, digits, channels) are pressed:
# `input keyevent KEYCODE_…`.
#
# Reference: https://www.home-assistant.io/integrations/androidtv

version: 2
name: Amazon Fire TV
icon: logo:firetv
description: Control your Amazon Fire TV / Fire TV Stick

# Device selector — the picker offers devices of this integration that
# expose a 'remote' entity, which is what this template's actions run on.
target_selector:
  device:
    integration: androidtv
    primary_domain: remote

# The `apps` kind of the favourites source reads the apps the player lists:
# its `apps` browse folder where it has one, else its `source_list`.
placeholders:
  app:
    source: favorites
    spec:
      category: apps

pages:
  remote:
    title: "logo:firetv ${_device.area_name}"
    buttons:
      button_1:
        icon: mdi:menu
        tooltip: {translate: menu}
        config:
          - action: remote.send_command
            data:
              command: MENU

      button_2:
        icon: mdi:arrow-up-bold-outline
        tooltip: {translate: up}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: UP

      button_3:
        icon: mdi:play-pause
        tooltip: {translate: play_pause}
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_MEDIA_PLAY_PAUSE

      button_4:
        icon: mdi:apps
        tooltip: {translate: apps}
        goto_page: apps

      button_5:
        icon: mdi:arrow-left-bold-outline
        tooltip: {translate: left}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: LEFT

      button_6:
        icon: mdi:circle-outline
        tooltip: {translate: select}
        config:
          - action: remote.send_command
            data:
              command: CENTER

      button_7:
        icon: mdi:arrow-right-bold-outline
        tooltip: {translate: right}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: RIGHT

      button_8:
        icon: mdi:dialpad
        tooltip: {translate: digits}
        goto_page: digits

      button_9:
        icon: mdi:volume-mute
        tooltip: {translate: mute}
        config:
          - action: remote.send_command
            data:
              command: MUTE

      button_10:
        icon: mdi:arrow-down-bold-outline
        tooltip: {translate: down}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: DOWN

      button_11:
        icon: mdi:home-outline
        tooltip: {translate: home}
        config:
          - action: remote.send_command
            data:
              command: HOME

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: remote.send_command
            data:
              command: POWER

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: VOLUME_UP

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: VOLUME_DOWN

      button_voice:
        icon: mdi:microphone
        tooltip: Alexa
        config:
          - action: remote.send_command
            data:
              command: SEARCH

      button_back:
        icon: mdi:keyboard-return
        tooltip: {translate: back}
        config:
          - action: remote.send_command
            data:
              command: BACK

  apps:
    subpage: true
    paginate: app
    max_parts: 3
    title: "mdi:apps ${_device.area_name}"
    buttons:
      button_1: "@app[1]"
      button_2: "@app[2]"
      button_3: "@app[3]"
      button_4: "@app[4]"
      button_5: "@app[5]"
      button_6: "@app[6]"
      button_7: "@app[7]"
      button_8: "@app[8]"
      button_9: "@app[9]"
      button_10: "@app[10]"
      button_11: "@app[11]"

      button_12:
        placeholder: "@app[12]"
        more_parts:
          icon: mdi:dots-horizontal
          tooltip: {translate: more}
          goto_page: next

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: remote.send_command
            data:
              command: POWER

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: VOLUME_UP

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: VOLUME_DOWN

      button_back:
        icon: mdi:arrow-left
        tooltip: {translate: back}
        goto_page: [previous, remote]

  digits:
    subpage: true
    title: "mdi:dialpad ${_device.area_name}"
    buttons:
      button_1:
        icon: 1
        tooltip: 1
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_1

      button_2:
        icon: 2
        tooltip: 2
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_2

      button_3:
        icon: 3
        tooltip: 3
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_3

      button_4:
        icon: mdi:chevron-up
        tooltip: CH+
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_CHANNEL_UP

      button_5:
        icon: 4
        tooltip: 4
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_4

      button_6:
        icon: 5
        tooltip: 5
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_5

      button_7:
        icon: 6
        tooltip: 6
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_6

      button_8:
        icon: mdi:chevron-down
        tooltip: CH-
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_CHANNEL_DOWN

      button_9:
        icon: 7
        tooltip: 7
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_7

      button_10:
        icon: 8
        tooltip: 8
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_8

      button_11:
        icon: 9
        tooltip: 9
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_9

      button_12:
        icon: 0
        tooltip: 0
        config:
          - action: remote.send_command
            data:
              command: input keyevent KEYCODE_0

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: remote.send_command
            data:
              command: POWER

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: VOLUME_UP

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: VOLUME_DOWN

      button_back:
        icon: mdi:arrow-left
        tooltip: {translate: remote}
        goto_page: remote
