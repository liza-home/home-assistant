# Amazon Fire TV Template — pre-configured remote control
#
# The remote page follows the LG webOS TV template: the arrow keys around OK,
# Home below them, and the TV's further pages on the right-hand column --
# Apps (button 4) where the TV has them. It is a subpage: not in the remote's
# page order, only reached from that button; on it, the remote's Back button
# leads back.
#   - Apps: the apps the integration lists as the media player's sources,
#     each opening with `media_player.select_source`; more than twelve get
#     more Apps pages, button 12 leading on.
#   A Fire TV has no digit keys over this protocol, so there is no Digits
#   page; and it lists no inputs, so there is no Inputs page. Buttons 8 and
#   12 are empty.

# Keys go through the fireTV (firetv_dial) integration's
# `remote.send_command`, which speaks the same DIAL + REST protocol as the
# official Fire TV phone app. It refuses any name outside its own key table
# (UP, CENTER, MENU, …) and its extras (PLAY_PAUSE, FAST_FORWARD, REWIND).

version: 2
name: Amazon Fire TV
icon: logo:firetv
description: Control your Amazon Fire TV / Fire TV Stick

# Device selector — the picker offers devices of this integration that
# expose a 'remote' entity, which is what this template's actions run on.
target_selector:
  device:
    integration: firetv_dial
    primary_domain: remote

# The `apps` kind of the favourites source reads the apps the player lists:
# its `apps` browse folder where it has one, else its `source_list`.
placeholders:
  app:
    source: favorites
    spec:
      category: apps

pages:
  remote:
    title: "logo:firetv ${_device.area_name}"
    buttons:
      button_1:
        icon: mdi:menu
        tooltip: {translate: menu}
        config:
          - action: remote.send_command
            data:
              command: MENU

      button_2:
        icon: mdi:arrow-up-bold-outline
        tooltip: {translate: up}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: UP

      button_3:
        icon: mdi:play-pause
        tooltip: {translate: play_pause}
        config:
          - action: remote.send_command
            data:
              command: PLAY_PAUSE

      button_4:
        icon: mdi:apps
        tooltip: "{translate: apps}…"
        goto_page: apps

      button_5:
        icon: mdi:arrow-left-bold-outline
        tooltip: {translate: left}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: LEFT

      button_6:
        icon: mdi:circle-outline
        tooltip: {translate: select}
        config:
          - action: remote.send_command
            data:
              command: CENTER

      button_7:
        icon: mdi:arrow-right-bold-outline
        tooltip: {translate: right}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: RIGHT

      button_9:
        icon: mdi:volume-mute
        tooltip: {translate: mute}
        config:
          - action: remote.send_command
            data:
              command: MUTE

      button_10:
        icon: mdi:arrow-down-bold-outline
        tooltip: {translate: down}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: DOWN

      button_11:
        icon: mdi:home-outline
        tooltip: {translate: home}
        config:
          - action: remote.send_command
            data:
              command: HOME

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: remote.send_command
            data:
              command: POWER

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: VOLUME_UP

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: VOLUME_DOWN

      button_back:
        icon: mdi:keyboard-return
        tooltip: {translate: back}
        config:
          - action: remote.send_command
            data:
              command: BACK

  apps:
    subpage: true
    paginate: app
    max_parts: 3
    title: "mdi:apps ${_device.area_name}"
    buttons:
      button_1: "@app[1]"
      button_2: "@app[2]"
      button_3: "@app[3]"
      button_4: "@app[4]"
      button_5: "@app[5]"
      button_6: "@app[6]"
      button_7: "@app[7]"
      button_8: "@app[8]"
      button_9: "@app[9]"
      button_10: "@app[10]"
      button_11: "@app[11]"

      button_12:
        placeholder: "@app[12]"
        more_parts:
          icon: mdi:dots-horizontal
          tooltip: "{translate: more}…"
          goto_page: next

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: remote.send_command
            data:
              command: POWER

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: VOLUME_UP

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: VOLUME_DOWN

      button_back:
        icon: mdi:arrow-left
        tooltip: {translate: back}
        goto_page: [previous, remote]
