# Philips TV Template — the TV's own remote keys
#
# Home Assistant's Philips TV integration gives the TV a `remote` and a
# `media_player`. Keys go through `remote.send_command` with jointSPACE's own
# key names (CursorUp, Confirm, Back, Home, Digit1 …, ChannelStepUp …).
# Power and volume use the media player's ordinary services.
#
# The remote page follows the LG webOS TV template: the arrow keys around OK,
# Home below them, and the TV's further pages on the right-hand column --
# Apps (button 4), Digits (button 8) and Inputs (button 12) where the TV has
# them. They are subpages: not in the remote's page order, only reached from
# those buttons; on each, the remote's Back button leads back.
#   - Apps: the apps the TV has installed, each opening with
#     `media_player.play_media`; more than twelve get more Apps pages, button
#     12 leading on. A Google TV set lists them with their own icons; a Saphi
#     or Titan OS set lists none and the page stays empty.
#   - Inputs: the TV's inputs (HDMI and the like, under the names given them
#     on the TV) -- every source the integration lists -- each chosen with
#     `media_player.select_source`.
#   - Digits: 1–9 and 0 as on a phone keypad, with Channel up and down.
#
# Reference: https://www.home-assistant.io/integrations/philips_js

version: 2
name: Philips TV
icon: mdi:television
description: Remote-control keys for a Philips TV (Philips TV integration)

target_selector:
  device:
    integration: philips_js
    primary_domain: remote

# The `apps` kind of the favourites source reads the apps the player lists:
# its `apps` browse folder where it has one, else its `source_list`.
placeholders:
  app:
    source: favorites
    spec:
      category: apps
  # The integration's sources are the TV's inputs only; its apps are browsed.
  input:
    source: favorites
    spec:
      category: inputs
      include: "*"

pages:
  remote:
    title: "mdi:television Philips ${_device.area_name}"
    buttons:
      button_1:
        icon: mdi:dots-vertical
        tooltip: {translate: options}
        config:
          - action: remote.send_command
            data:
              command: Options

      button_2:
        icon: mdi:arrow-up-bold-outline
        tooltip: {translate: up}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: CursorUp

      button_3:
        icon: mdi:play-pause
        tooltip: {translate: play_pause}
        config:
          - action: remote.send_command
            data:
              command: PlayPause

      button_4:
        icon: mdi:apps
        tooltip: {translate: apps}
        goto_page: apps

      button_5:
        icon: mdi:arrow-left-bold-outline
        tooltip: {translate: left}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: CursorLeft

      button_6:
        icon: mdi:circle-outline
        tooltip: {translate: ok}
        config:
          - action: remote.send_command
            data:
              command: Confirm

      button_7:
        icon: mdi:arrow-right-bold-outline
        tooltip: {translate: right}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: CursorRight

      button_8:
        icon: mdi:dialpad
        tooltip: {translate: digits}
        goto_page: digits

      button_9:
        icon: mdi:rewind
        tooltip: {translate: previous}
        config:
          - action: remote.send_command
            data:
              command: Rewind

      button_10:
        icon: mdi:arrow-down-bold-outline
        tooltip: {translate: down}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: CursorDown

      button_11:
        icon: mdi:home-outline
        tooltip: {translate: home}
        config:
          - action: remote.send_command
            data:
              command: Home

      button_12:
        icon: mdi:video-input-hdmi
        tooltip: {translate: inputs}
        goto_page: inputs

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: media_player.toggle

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: media_player.volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: media_player.volume_down

      slider_vertical:
        icon: mdi:volume-high
        tooltip: {translate: volume}
        slider_actions:
          mode: proportional
          attribute: volume_level
          service: media_player.volume_set
          data_key: volume_level
          factor: 1.0
          min: 0.0
          max: 1.0

      button_back:
        icon: mdi:keyboard-return
        tooltip: {translate: back}
        config:
          - action: remote.send_command
            data:
              command: Back

  apps:
    subpage: true
    paginate: app
    max_parts: 3
    title: "mdi:apps ${_device.area_name}"
    buttons:
      button_1: "@app[1]"
      button_2: "@app[2]"
      button_3: "@app[3]"
      button_4: "@app[4]"
      button_5: "@app[5]"
      button_6: "@app[6]"
      button_7: "@app[7]"
      button_8: "@app[8]"
      button_9: "@app[9]"
      button_10: "@app[10]"
      button_11: "@app[11]"

      button_12:
        placeholder: "@app[12]"
        more_parts:
          icon: mdi:dots-horizontal
          tooltip: {translate: more}
          goto_page: next

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: media_player.toggle

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: media_player.volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: media_player.volume_down

      slider_vertical:
        icon: mdi:volume-high
        tooltip: {translate: volume}
        slider_actions:
          mode: proportional
          attribute: volume_level
          service: media_player.volume_set
          data_key: volume_level
          factor: 1.0
          min: 0.0
          max: 1.0

      button_back:
        icon: mdi:arrow-left
        tooltip: {translate: back}
        goto_page: [previous, remote]

  inputs:
    subpage: true
    title: "mdi:video-input-hdmi ${_device.area_name}"
    buttons:
      button_1: "@input[1]"
      button_2: "@input[2]"
      button_3: "@input[3]"
      button_4: "@input[4]"
      button_5: "@input[5]"
      button_6: "@input[6]"
      button_7: "@input[7]"
      button_8: "@input[8]"
      button_9: "@input[9]"
      button_10: "@input[10]"
      button_11: "@input[11]"
      button_12: "@input[12]"

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: media_player.toggle

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: media_player.volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: media_player.volume_down

      slider_vertical:
        icon: mdi:volume-high
        tooltip: {translate: volume}
        slider_actions:
          mode: proportional
          attribute: volume_level
          service: media_player.volume_set
          data_key: volume_level
          factor: 1.0
          min: 0.0
          max: 1.0

      button_back:
        icon: mdi:arrow-left
        tooltip: {translate: remote}
        goto_page: remote

  digits:
    subpage: true
    title: "mdi:dialpad ${_device.area_name}"
    buttons:
      button_1:
        icon: 1
        tooltip: 1
        config:
          - action: remote.send_command
            data:
              command: Digit1

      button_2:
        icon: 2
        tooltip: 2
        config:
          - action: remote.send_command
            data:
              command: Digit2

      button_3:
        icon: 3
        tooltip: 3
        config:
          - action: remote.send_command
            data:
              command: Digit3

      button_4:
        icon: mdi:chevron-up
        tooltip: CH+
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: ChannelStepUp

      button_5:
        icon: 4
        tooltip: 4
        config:
          - action: remote.send_command
            data:
              command: Digit4

      button_6:
        icon: 5
        tooltip: 5
        config:
          - action: remote.send_command
            data:
              command: Digit5

      button_7:
        icon: 6
        tooltip: 6
        config:
          - action: remote.send_command
            data:
              command: Digit6

      button_8:
        icon: mdi:chevron-down
        tooltip: CH-
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: ChannelStepDown

      button_9:
        icon: 7
        tooltip: 7
        config:
          - action: remote.send_command
            data:
              command: Digit7

      button_10:
        icon: 8
        tooltip: 8
        config:
          - action: remote.send_command
            data:
              command: Digit8

      button_11:
        icon: 9
        tooltip: 9
        config:
          - action: remote.send_command
            data:
              command: Digit9

      button_12:
        icon: 0
        tooltip: 0
        config:
          - action: remote.send_command
            data:
              command: Digit0

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: media_player.toggle

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: media_player.volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: media_player.volume_down

      slider_vertical:
        icon: mdi:volume-high
        tooltip: {translate: volume}
        slider_actions:
          mode: proportional
          attribute: volume_level
          service: media_player.volume_set
          data_key: volume_level
          factor: 1.0
          min: 0.0
          max: 1.0

      button_back:
        icon: mdi:arrow-left
        tooltip: {translate: remote}
        goto_page: remote
