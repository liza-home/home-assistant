# A TV by infrared, sent by the lizaIP the page is on. `@ir:<key>` becomes that
# key of the chosen IR device when the page is added, sent by name; a key its code
# set lacks leaves its button off the page.

version: 2
# Sending infrared needs firmware 11.4.3 or newer. `max_firmware: X` would instead
# offer a template only below X; either may be given, the bound is read as a version.
min_firmware: 11.4.3
name: TV (infrared)
icon: mdi:remote-tv
description: Power, channels, volume and the arrow keys, sent by infrared

target_selector:
  device:
    integration: lizaip
    subentry_type: ir_device

pages:
  remote:
    title: "mdi:remote-tv ${_device.friendly_name}"
    buttons:
      button_1:
        icon: mdi:menu
        tooltip: {translate: menu}
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:menu"

      button_2:
        icon: mdi:arrow-up-bold-outline
        tooltip: {translate: up}
        key_repeat: true
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:cursor_up"

      button_3:
        icon: mdi:information-outline
        tooltip: {translate: info}
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:info"

      button_4:
        icon: mdi:dialpad
        tooltip: {translate: digits}
        goto_page: digits

      button_5:
        icon: mdi:arrow-left-bold-outline
        tooltip: {translate: left}
        key_repeat: true
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:cursor_left"

      button_6:
        icon: mdi:circle-outline
        tooltip: {translate: select}
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:ok"

      button_7:
        icon: mdi:arrow-right-bold-outline
        tooltip: {translate: right}
        key_repeat: true
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:cursor_right"

      button_8:
        icon: mdi:video-input-hdmi
        tooltip: {translate: inputs}
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:input"

      button_9:
        icon: mdi:television-guide
        tooltip: {translate: tv_guide}
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:epg"

      button_10:
        icon: mdi:arrow-down-bold-outline
        tooltip: {translate: down}
        key_repeat: true
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:cursor_down"

      button_11:
        icon: mdi:home-outline
        tooltip: {translate: home}
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:home"

      button_12:
        icon: mdi:volume-mute
        tooltip: {translate: mute}
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:mute"

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:power"

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:volume_up"

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:volume_down"

      button_back:
        icon: mdi:keyboard-return
        tooltip: {translate: back}
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:back"

  digits:
    subpage: true
    title: "mdi:dialpad ${_device.friendly_name}"
    buttons:
      button_1:
        icon: 1
        tooltip: 1
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:number_1"

      button_2:
        icon: 2
        tooltip: 2
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:number_2"

      button_3:
        icon: 3
        tooltip: 3
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:number_3"

      button_4:
        icon: mdi:chevron-up
        tooltip: CH+
        key_repeat: true
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:channel_up"

      button_5:
        icon: 4
        tooltip: 4
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:number_4"

      button_6:
        icon: 5
        tooltip: 5
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:number_5"

      button_7:
        icon: 6
        tooltip: 6
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:number_6"

      button_8:
        icon: mdi:chevron-down
        tooltip: CH-
        key_repeat: true
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:channel_down"

      button_9:
        icon: 7
        tooltip: 7
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:number_7"

      button_10:
        icon: 8
        tooltip: 8
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:number_8"

      button_11:
        icon: 9
        tooltip: 9
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:number_9"

      button_12:
        icon: 0
        tooltip: 0
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:number_0"

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:power"

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:volume_up"

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: lizaip.send_ir
            data:
              key: "@ir:volume_down"

      button_back:
        icon: mdi:arrow-left
        tooltip: {translate: remote}
        goto_page: remote
