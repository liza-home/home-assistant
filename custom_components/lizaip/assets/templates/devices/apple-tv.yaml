# Apple TV Template — pre-configured remote control
#
# Keys go through the Apple TV integration's `remote.send_command`
# (up, select, menu, home, play_pause, volume_up, …).
#
# The remote page follows the LG webOS TV template: the arrow keys around OK,
# Home below them, and the TV's further pages on the right-hand column --
# Apps (button 4), Digits (button 8) and Inputs (button 12) where the TV has
# them. They are subpages: not in the remote's page order, only reached from
# those buttons; on each, the remote's Back button leads back.
#   - Apps: the Apple TV's apps, each opening with `media_player.play_media`;
#     more than twelve get more Apps pages, button 12 leading on.
#   An Apple TV has no digit keys and no inputs, so it has neither page; their
#   buttons hold Skip forward instead, and nothing.
#
# Reference: https://www.home-assistant.io/integrations/apple_tv

version: 2
name: Apple TV
icon: mdi:apple
description: Control your Apple TV

# Device selector — the picker offers devices of this integration that
# expose a 'remote' entity, which is what this template's actions run on.
target_selector:
  device:
    integration: apple_tv
    primary_domain: remote

# The `apps` kind of the favourites source reads the apps the player lists:
# its `apps` browse folder where it has one, else its `source_list`.
placeholders:
  app:
    source: favorites
    spec:
      category: apps

pages:
  remote:
    title: "logo:appletv ${_device.area_name}"
    buttons:
      button_1:
        icon: mdi:menu
        tooltip: {translate: top_menu}
        config:
          - action: remote.send_command
            data:
              command: top_menu

      button_2:
        icon: mdi:arrow-up-bold-outline
        tooltip: {translate: up}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: up

      button_3:
        icon: mdi:play-pause
        tooltip: {translate: play_pause}
        config:
          - action: remote.send_command
            data:
              command: play_pause

      button_4:
        icon: mdi:apps
        tooltip: {translate: apps}
        goto_page: apps

      button_5:
        icon: mdi:arrow-left-bold-outline
        tooltip: {translate: left}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: left

      button_6:
        icon: mdi:circle-outline
        tooltip: {translate: select}
        config:
          - action: remote.send_command
            data:
              command: select

      button_7:
        icon: mdi:arrow-right-bold-outline
        tooltip: {translate: right}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: right

      button_9:
        icon: mdi:skip-backward
        tooltip: {translate: previous}
        config:
          - action: remote.send_command
            data:
              command: skip_backward

      button_10:
        icon: mdi:arrow-down-bold-outline
        tooltip: {translate: down}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: down

      button_11:
        icon: mdi:home-outline
        tooltip: {translate: home}
        config:
          - action: remote.send_command
            data:
              command: home

      button_12:
        icon: mdi:skip-forward
        tooltip: {translate: next}
        config:
          - action: remote.send_command
            data:
              command: skip_forward

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: remote.send_command
            data:
              command: wakeup

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: volume_down

      button_voice:
        icon: mdi:microphone
        tooltip: Siri
        config:
          - action: remote.send_command
            data:
              command: siri

      button_back:
        icon: mdi:keyboard-return
        tooltip: {translate: back_menu}
        config:
          - action: remote.send_command
            data:
              command: menu

  apps:
    subpage: true
    paginate: app
    max_parts: 3
    title: "mdi:apps ${_device.area_name}"
    buttons:
      button_1: "@app[1]"
      button_2: "@app[2]"
      button_3: "@app[3]"
      button_4: "@app[4]"
      button_5: "@app[5]"
      button_6: "@app[6]"
      button_7: "@app[7]"
      button_8: "@app[8]"
      button_9: "@app[9]"
      button_10: "@app[10]"
      button_11: "@app[11]"

      button_12:
        placeholder: "@app[12]"
        more_parts:
          icon: mdi:dots-horizontal
          tooltip: {translate: more}
          goto_page: next

      button_power:
        icon: mdi:power
        tooltip: {translate: power}
        config:
          - action: remote.send_command
            data:
              command: wakeup

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: remote.send_command
            data:
              command: volume_down

      button_back:
        icon: mdi:arrow-left
        tooltip: {translate: back}
        goto_page: [previous, remote]
