# Sonos Cover Template — the album art across nine buttons
#
# Like `sonos-single.yaml`, but buttons 1–3, 5–7 and 9–11 show the cover of what is
# playing instead of favourites: the picture is scaled to 180×186 and each
# button cuts its 60×62 piece out of it (imgserv `size=` + `box=`), so the nine
# together read as one picture. The fourth column is transport — previous,
# play/pause, next — with the track each press lands on as its tooltip.
#
# The tiles are pictures, not buttons: pressing one does nothing.
#
# Reference: https://www.home-assistant.io/integrations/sonos

version: 2
name: Sonos Cover
icon: mdi:album
description: The album art across the buttons, with previous, play and next

target_selector:
  device:
    integration: sonos
    primary_domain: media_player

pages:
  cover:
    # The page title: the Sonos mark and the speaker's name.
    title: "logo:sonos + ${_device.friendly_name}"
    buttons:
      # Row by row: `box=x,y,w,h` in the 180×186 picture.
      button_1:
        icon: "${_device.entity_picture}?size=180x186&box=0,0,60,62"
        tooltip: "${_device.media_artist}: ${_device.media_album_name}"
      button_2:
        icon: "${_device.entity_picture}?size=180x186&box=60,0,60,62"
        tooltip: "${_device.media_artist}: ${_device.media_album_name}"
      button_3:
        icon: "${_device.entity_picture}?size=180x186&box=120,0,60,62"
        tooltip: "${_device.media_artist}: ${_device.media_album_name}"
      button_5:
        icon: "${_device.entity_picture}?size=180x186&box=0,62,60,62"
        tooltip: "${_device.media_artist}: ${_device.media_album_name}"
      button_6:
        icon: "${_device.entity_picture}?size=180x186&box=60,62,60,62"
        tooltip: "${_device.media_artist}: ${_device.media_album_name}"
      button_7:
        icon: "${_device.entity_picture}?size=180x186&box=120,62,60,62"
        tooltip: "${_device.media_artist}: ${_device.media_album_name}"
      button_9:
        icon: "${_device.entity_picture}?size=180x186&box=0,124,60,62"
        tooltip: "${_device.media_title}"
      button_10:
        icon: "${_device.entity_picture}?size=180x186&box=60,124,60,62"
        tooltip: "${_device.media_artist}: ${_device.media_album_name}"
      button_11:
        icon: "${_device.entity_picture}?size=180x186&box=120,124,60,62"
        tooltip: "${_device.media_artist}: ${_device.media_album_name}"

      button_4:
        icon: mdi:skip-previous
        # The track the press lands on, not the one playing; empty where there is
        # none -- shuffle, radio, the start of the queue.
        tooltip: "${_device.media_title_prev}"
        config:
          - action: media_player.media_previous_track

      button_8:
        icon: mdi:play-pause
        tooltip: "${_device.media_title}"
        config:
          - action: media_player.media_play_pause

      button_12:
        icon: mdi:skip-next
        tooltip: "${_device.media_title_next}"
        config:
          - action: media_player.media_next_track

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: media_player.volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: media_player.volume_down

      slider_vertical:
        icon: mdi:volume-high
        tooltip: {translate: volume}
        slider_actions:
          mode: proportional
          attribute: volume_level
          service: media_player.volume_set
          data_key: volume_level
          factor: 1.0
          min: 0.0
          max: 1.0
