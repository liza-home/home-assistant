# Sonos Audiobooks Template — audiobooks on buttons 1–12
#
# As `sonos-radio.yaml`, for the speaker's favourite audiobooks: the `audiobook`
# placeholder narrows the favorites source to the Sonos "Audiobooks" favourites
# folder. Offered only for a speaker that has favourite audiobooks.
#
# Reference: https://www.home-assistant.io/integrations/sonos

version: 2
name: Sonos Audiobooks
icon: mdi:book-music
description: Your favourite Sonos audiobooks, one per button

target_selector:
  device:
    integration: sonos
    primary_domain: media_player

placeholders:
  audiobook:
    source: favorites
    spec:
      category: audiobooks

pages:
  audiobooks:
    # More pages, swiped to, when there are more than twelve (up to
    # `max_parts`); they come and go as favourites are added and removed.
    paginate: audiobook
    max_parts: 3
    # The page title: the Sonos mark and what the page holds.
    title: "logo:sonos + audiobooks"
    buttons:
      button_1: "@audiobook[1]"
      button_2: "@audiobook[2]"
      button_3: "@audiobook[3]"
      button_4: "@audiobook[4]"
      button_5: "@audiobook[5]"
      button_6: "@audiobook[6]"
      button_7: "@audiobook[7]"
      button_8: "@audiobook[8]"
      button_9: "@audiobook[9]"
      button_10: "@audiobook[10]"
      button_11: "@audiobook[11]"
      button_12: "@audiobook[12]"

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: media_player.volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: media_player.volume_down

      # The mechanics live in `slider_actions`, as a page stores them; the subject
      # is left out because the page's own target supplies it.
      slider_vertical:
        icon: mdi:volume-high
        tooltip: {translate: volume}
        slider_actions:
          mode: proportional
          attribute: volume_level
          service: media_player.volume_set
          data_key: volume_level
          factor: 1.0
          min: 0.0
          max: 1.0
