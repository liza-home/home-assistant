# Sonos Podcasts Template — podcasts on buttons 1–12
#
# As `sonos-radio.yaml`, for the speaker's favourite podcasts: the `podcast`
# placeholder narrows the favorites source to the Sonos "Podcasts" favourites
# folder. Offered only for a speaker that has favourite podcasts.
#
# Reference: https://www.home-assistant.io/integrations/sonos

version: 2
name: Sonos Podcasts
icon: mdi:podcast
description: Your favourite Sonos podcasts, one per button

target_selector:
  device:
    integration: sonos
    primary_domain: media_player

placeholders:
  podcast:
    source: favorites
    spec:
      category: podcasts

pages:
  podcasts:
    # More pages, swiped to, when there are more than twelve (up to
    # `max_parts`); they come and go as favourites are added and removed.
    paginate: podcast
    max_parts: 3
    # The page title: the Sonos mark and what the page holds.
    title: "logo:sonos + podcasts"
    buttons:
      button_1: "@podcast[1]"
      button_2: "@podcast[2]"
      button_3: "@podcast[3]"
      button_4: "@podcast[4]"
      button_5: "@podcast[5]"
      button_6: "@podcast[6]"
      button_7: "@podcast[7]"
      button_8: "@podcast[8]"
      button_9: "@podcast[9]"
      button_10: "@podcast[10]"
      button_11: "@podcast[11]"
      button_12: "@podcast[12]"

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: media_player.volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: media_player.volume_down

      # The mechanics live in `slider_actions`, as a page stores them; the subject
      # is left out because the page's own target supplies it.
      slider_vertical:
        icon: mdi:volume-high
        tooltip: {translate: volume}
        slider_actions:
          mode: proportional
          attribute: volume_level
          service: media_player.volume_set
          data_key: volume_level
          factor: 1.0
          min: 0.0
          max: 1.0
