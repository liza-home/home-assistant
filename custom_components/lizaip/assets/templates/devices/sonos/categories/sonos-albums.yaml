# Sonos Albums Template — albums on buttons 1–12
#
# As `sonos-radio.yaml`, for the speaker's favourite albums: the `album`
# placeholder narrows the favorites source to the Sonos "Albums" favourites
# folder. Offered only for a speaker that has favourite albums.
#
# Reference: https://www.home-assistant.io/integrations/sonos

version: 2
name: Sonos Albums
icon: mdi:album
description: Your favourite Sonos albums, one per button

target_selector:
  device:
    integration: sonos
    primary_domain: media_player

placeholders:
  album:
    source: favorites
    spec:
      category: albums

pages:
  albums:
    # More pages, swiped to, when there are more than twelve (up to
    # `max_parts`); they come and go as favourites are added and removed.
    paginate: album
    max_parts: 3
    # The page title: the Sonos mark and what the page holds.
    title: "logo:sonos + albums"
    buttons:
      button_1: "@album[1]"
      button_2: "@album[2]"
      button_3: "@album[3]"
      button_4: "@album[4]"
      button_5: "@album[5]"
      button_6: "@album[6]"
      button_7: "@album[7]"
      button_8: "@album[8]"
      button_9: "@album[9]"
      button_10: "@album[10]"
      button_11: "@album[11]"
      button_12: "@album[12]"

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: media_player.volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: media_player.volume_down

      # The mechanics live in `slider_actions`, as a page stores them; the subject
      # is left out because the page's own target supplies it.
      slider_vertical:
        icon: mdi:volume-high
        tooltip: {translate: volume}
        slider_actions:
          mode: proportional
          attribute: volume_level
          service: media_player.volume_set
          data_key: volume_level
          factor: 1.0
          min: 0.0
          max: 1.0
