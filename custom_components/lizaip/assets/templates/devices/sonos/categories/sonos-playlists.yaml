# Sonos Playlists Template — playlists on buttons 1–12
#
# Like `sonos-single.yaml`, but buttons 1–12 are only the speaker's favourite
# playlists: the `playlist` placeholder narrows the favorites source to the
# Sonos "Playlists" favourites folder, so radio stations, albums and tracks
# never land here. Title, art and play_media come from the favourite, and the binding is live: adding,
# renaming or reordering one in the Sonos app refreshes the buttons. Slots
# without a favourite stay empty.
#
# The page title is the Sonos mark and the page's name (`title`).
#
# Reference: https://www.home-assistant.io/integrations/sonos

version: 2
name: Sonos Playlists
icon: mdi:playlist-music
description: Your favourite Sonos playlists, one per button

target_selector:
  device:
    integration: sonos
    primary_domain: media_player

placeholders:
  playlist:
    source: favorites
    spec:
      category: playlists

pages:
  playlists:
    # More pages, swiped to, when there are more than twelve (up to
    # `max_parts`); they come and go as favourites are added and removed.
    paginate: playlist
    max_parts: 3
    # The page title: the Sonos mark and what the page holds.
    title: "logo:sonos + playlist"
    buttons:
      button_1: "@playlist[1]"
      button_2: "@playlist[2]"
      button_3: "@playlist[3]"
      button_4: "@playlist[4]"
      button_5: "@playlist[5]"
      button_6: "@playlist[6]"
      button_7: "@playlist[7]"
      button_8: "@playlist[8]"
      button_9: "@playlist[9]"
      button_10: "@playlist[10]"
      button_11: "@playlist[11]"
      button_12: "@playlist[12]"

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: media_player.volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: media_player.volume_down

      # The mechanics live in `slider_actions`, as a page stores them; the subject
      # is left out because the page's own target supplies it.
      slider_vertical:
        icon: mdi:volume-high
        tooltip: {translate: volume}
        slider_actions:
          mode: proportional
          attribute: volume_level
          service: media_player.volume_set
          data_key: volume_level
          factor: 1.0
          min: 0.0
          max: 1.0
