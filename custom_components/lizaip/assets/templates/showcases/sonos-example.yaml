# Sonos example — tiles that follow the speaker through `${_device…}`
#
# `_device` is the page's own target, so every tile reads the speaker the page
# was created for: the page title shows its name, button 1 its cover art, button
# 4 its volume, and the transport tiles what is playing.
#
# Taken from a page on the test remote, to try device variables in tiles,
# tooltips and media pictures. Beta builds only.

version: 2
name: Sonos example
icon: logo:sonos
description: Device variables in tiles — cover art, volume and what's playing

target_selector:
  device:
    integration: sonos
    primary_domain: media_player

pages:
  sonos:
    title: "logo:sonos + ${_device}"
    buttons:
      button_1:
        icon: "media:${_device.entity_picture}?size=120x120"
        tooltip: "media:${_device.entity_picture}?size=60x60"

      button_4:
        icon: "text:${round(_device.volume_level*100)}%"
        tooltip: "Vol ${round(_device.volume_level*100)}%"

      button_9:
        icon: mdi:skip-previous
        tooltip: "${_device.media_title_prev}"
        config:
          - action: media_player.media_previous_track

      button_10:
        icon: mdi:play-pause
        tooltip: "${_device.media_title}"
        config:
          - action: media_player.media_play_pause

      button_11:
        icon: mdi:skip-next
        tooltip: "${_device.media_title_next}"
        config:
          - action: media_player.media_next_track

      button_12:
        icon: mdi:volume-mute
        tooltip: {translate: mute}
        config:
          - action: media_player.volume_mute

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: media_player.volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: media_player.volume_down

      slider_vertical:
        icon: mdi:volume-high
        tooltip: {translate: volume}
        slider_actions:
          mode: proportional
          factor: 1.0
          min: 0.0
          max: 1.0
          attribute: volume_level
          service: media_player.volume_set
          data_key: volume_level
