# This remote — its own battery, charge and firmware, on its own face
#
# Bound to nothing, and needs nothing: every lizaIP remote reports its battery,
# whether it is charging or in a hand, its address, the Home Assistant it talks
# to, and its firmware. When the page is added it looks up *this* remote's
# sensors (`@remote_entry` is the remote the page is for) and writes their ids
# into the tiles, so the values below follow the remote you are holding. After
# that the tiles are ordinary values: edit one in the panel to point it at
# anything else.
#
# The same page is the second of the pages a remote with none shows
# (`_default-pages.yaml`); the two are copies, so change both.
#
#   1      the battery level beside its icon (stacked on a square tile)
#   2      the same level as a fill: `?percent=` takes a calculation
#   3      an icon picked by arithmetic -- battery icons only exist in steps
#          of ten, so the level is rounded into one, no template helper
#   4      a day of battery history as a graph; the tooltip widens it to a week
#   5      the address of the Home Assistant serving these pages -- tile 6 is
#          where the remote is, this is where we are, which is the thing to
#          read out loud when a remote stops finding Home Assistant. The tile
#          stays a plain logo and the address is read from the tooltip, which
#          has the room an address needs
#   6      its own network address, in the tooltip for the same reason
#   7      the firmware it runs, an attribute of an update entity, on the tile
#          beside the chip and in the tooltip
#   8      whether it is in a hand right now -- pick it up and watch
#   9      whether it is charging, read from a binary sensor
#   10     the level as big text with `%` added by hand: a calculation reads
#          a bare number, without its unit
#   11     the level against a full charge in words, worked out live
#   12     the level as a pie of eight slices: arithmetic maps 0-100 %
#          onto circle-slice-1 ... -8

version: 2
name: "This remote"
icon: mdi:remote
description: The remote's own battery, charge, addresses and firmware — values, fill levels and history

placeholders:
  battery:
    source: entities
    spec: {config_entry: "@remote_entry", translation_key: battery}
  charging:
    source: entities
    spec: {config_entry: "@remote_entry", translation_key: charging}
  in_hand:
    source: entities
    spec: {config_entry: "@remote_entry", translation_key: in_hand}
  address:
    source: entities
    spec: {config_entry: "@remote_entry", translation_key: ip_address}
  ha_address:
    source: entities
    spec: {config_entry: "@remote_entry", translation_key: ha_address}
  firmware:
    source: entities
    spec: {config_entry: "@remote_entry", translation_key: firmware}

pages:
  this-remote:
    title: "mdi:remote text:This remote"
    buttons:
      button_1:
        icon: "mdi:battery ${{@battery[1].entity_id}}"
        tooltip: "Battery ${{@battery[1].entity_id}}"
      button_2:
        icon: "mdi:battery-outline?percent=${round({@battery[1].entity_id})}"
        tooltip: "Battery as a fill level"
      button_3:
        icon: "mdi:battery-${max(10, min(90, round({@battery[1].entity_id} / 10) * 10))}"
        tooltip: "An icon picked by arithmetic"
      button_4:
        icon: "history:{@battery[1].entity_id}?hours=24"
        tooltip: "history:{@battery[1].entity_id}?hours=168"

      button_5:
        icon: "mdi:home-assistant"
        tooltip: "HA ${{@ha_address[1].entity_id}}"
      button_6:
        icon: "mdi:remote"
        tooltip: "RCU ${{@address[1].entity_id}}"
      button_7:
        icon: "mdi:chip ${{@firmware[1].entity_id}.installed_version}"
        tooltip: "Firmware ${{@firmware[1].entity_id}.installed_version}"
      button_8:
        icon: mdi:hand-back-right
        tooltip: "In hand: ${{@in_hand[1].entity_id}}"

      button_9:
        icon: mdi:battery-charging
        tooltip: "Charging: ${{@charging[1].entity_id}}"
      button_10:
        icon: "text:${round({@battery[1].entity_id})}%"
        tooltip: "Battery ${round({@battery[1].entity_id})}%"
      button_11:
        icon: "text:-${100 - round({@battery[1].entity_id})}%?font_size=24"
        tooltip: "${100 - round({@battery[1].entity_id})}% short of a full charge"
      button_12:
        icon: "mdi:circle-slice-${max(1, min(8, 1 + round({@battery[1].entity_id} * 7 / 100)))}"
        tooltip: "Battery ${round({@battery[1].entity_id})}% as a pie"
