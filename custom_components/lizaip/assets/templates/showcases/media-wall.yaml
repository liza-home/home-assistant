# Media wall — a player's state as pictures
#
# Pick any media player. Everything follows it through `${_device…}`.
#
#   1, 2, 5, 6  the cover of what is playing, spread over a 2x2 block: scaled
#               to 120x124 with `size=` and cut into 60x62 pieces with `box=`
#   3           the volume as a fill level: `?percent=` takes a calculation,
#               so the speaker icon fills as the volume rises
#   4           how far into the track, the same way, from two attributes
#   7           the artist as words; the tooltip names the album
#   8           two marks sharing one tile (`mdi:play mdi:pause`), and a
#               tooltip mixing `{translate: ${_state}}` with the title
#   9, 11       previous and next, each tooltip naming the track the press
#               lands on (Sonos only -- empty elsewhere)
#   10          the source, drawn as text
#   12          a mark with words under it: a single icon followed by words is
#               stacked on a square button
#
# The fill levels follow attribute changes the player reports; most players
# report the position only when the state changes, so 4 is not a running
# clock.

version: 2
name: "Media wall"
icon: mdi:image-multiple
description: Cover art over four buttons, volume and progress as fill levels

target_selector:
  device:
    integration: sonos
    primary_domain: media_player

pages:
  media-wall:
    title: "mdi:speaker ${_device} ${round(_device.volume_level * 100)}%"
    buttons:
      # `box=x,y,w,h` in the 120x124 picture.
      button_1:
        icon: "${_device.entity_picture}?size=120x124&box=0,0,60,62"
        tooltip: "${_device.media_artist}: ${_device.media_album_name}"
      button_2:
        icon: "${_device.entity_picture}?size=120x124&box=60,0,60,62"
        tooltip: "${_device.media_artist}: ${_device.media_album_name}"
      button_5:
        icon: "${_device.entity_picture}?size=120x124&box=0,62,60,62"
        tooltip: "${_device.media_artist}: ${_device.media_album_name}"
      button_6:
        icon: "${_device.entity_picture}?size=120x124&box=60,62,60,62"
        tooltip: "${_device.media_artist}: ${_device.media_album_name}"

      button_3:
        icon: "mdi:volume-high?percent=${round(_device.volume_level * 100)}"
        tooltip: "Volume ${round(_device.volume_level * 100)}%"
        config:
          - action: media_player.volume_up

      button_4:
        icon: "mdi:progress-clock?percent=${round(_device.media_position * 100 / _device.media_duration)}"
        tooltip: "${round(_device.media_position * 100 / _device.media_duration)}% of ${round(_device.media_duration / 60)} min"

      button_7:
        icon: "text:${_device.media_artist}"
        tooltip: "${_device.media_album_name}"

      button_8:
        icon: mdi:play mdi:pause
        tooltip: "{translate: ${_state}} - ${_device.media_title}"
        config:
          - action: media_player.media_play_pause

      button_9:
        icon: mdi:skip-previous
        tooltip: "${_device.media_title_prev}"
        config:
          - action: media_player.media_previous_track
      button_11:
        icon: mdi:skip-next
        tooltip: "${_device.media_title_next}"
        config:
          - action: media_player.media_next_track

      button_10:
        icon: "text:${_device.source}"
        tooltip: "Source ${_device.source}"

      button_12:
        icon: "mdi:speaker ${_device.area_name}"
        tooltip: "${_device} · ${_device.area_name}"

      button_volume_up:
        icon: mdi:volume-plus
        tooltip: {translate: volume_up}
        key_repeat: true
        config:
          - action: media_player.volume_up

      button_volume_down:
        icon: mdi:volume-minus
        tooltip: {translate: volume_down}
        key_repeat: true
        config:
          - action: media_player.volume_down

      slider_vertical:
        icon: mdi:volume-high
        tooltip: {translate: volume}
        slider_actions:
          mode: proportional
          attribute: volume_level
          service: media_player.volume_set
          data_key: volume_level
          factor: 1.0
          min: 0.0
          max: 1.0
