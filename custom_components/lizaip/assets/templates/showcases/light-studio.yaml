# Light studio — one lamp, every way a tile can talk about it
#
# Pick any lamp. Every tile reads it through `${_device…}`, so the page follows
# whichever lamp it was created for, and every value is live.
#
#   1      the lamp itself: the icon takes the lamp's own colour and fills to
#          its brightness on its own; the tooltip prints `{translate: ${_state}}`
#   2      brightness as big text, computed from 0-255: `round(x * 100 / 255)`
#   3      colour temperature in kelvin, straight from an attribute
#   4      device facts rather than state: manufacturer, model, firmware
#   5-8    brightness presets, each icon pre-filled to the level it sets with
#          `?percent=` -- the picture *is* the tooltip
#   9-11   colour temperature presets, each icon tinted the white it gives
#          with `?fg=` and a hex colour
#   12     off, drawn in the `off` state colour
#
# A value with nothing behind it -- brightness while the lamp is off, kelvin on
# a lamp that has no colour temperature -- collapses away, and the tile falls
# back to the icon its action would show anyway.

version: 2
name: "Light studio"
icon: mdi:lightbulb-group
description: Live values, fill levels and tinted presets for one lamp

target_selector:
  device:
    integration: [hue, homekit_controller, nanoleaf]
    primary_domain: light

pages:
  light-studio:
    # A mark, the lamp's name and its room, in one title strip.
    title: "mdi:lightbulb-group ${_device} · ${_device.area_name}"
    buttons:
      button_1:
        icon: mdi:lightbulb
        tooltip: "${_device} {translate: ${_state}}"
        config:
          - action: light.toggle

      button_2:
        icon: "text:${round(_device.brightness * 100 / 255)}%"
        tooltip: "{translate: brightness} ${round(_device.brightness * 100 / 255)}%"

      button_3:
        icon: "text:${_device.color_temp_kelvin}K?font_size=20"
        tooltip: "{translate: colour_temperature} ${_device.color_temp_kelvin} K"

      button_4:
        icon: mdi:information-outline
        tooltip: "${_device.manufacturer} ${_device.model} · ${_device.sw_version}"

      # The fill is the level each one sets.
      button_5:
        icon: mdi:lightbulb-on?percent=25
        tooltip: "{translate: brightness} 25 %"
        config:
          - action: light.turn_on
            data:
              brightness_pct: 25
      button_6:
        icon: mdi:lightbulb-on?percent=50
        tooltip: "{translate: brightness} 50 %"
        config:
          - action: light.turn_on
            data:
              brightness_pct: 50
      button_7:
        icon: mdi:lightbulb-on?percent=75
        tooltip: "{translate: brightness} 75 %"
        config:
          - action: light.turn_on
            data:
              brightness_pct: 75
      button_8:
        icon: mdi:lightbulb-on?percent=100
        tooltip: "{translate: brightness} 100 %"
        config:
          - action: light.turn_on
            data:
              brightness_pct: 100

      # The tint is the white each one gives.
      button_9:
        icon: mdi:thermometer-low?fg=FFB46B
        tooltip: "{translate: warm_white} 2700 K"
        config:
          - action: light.turn_on
            data:
              color_temp_kelvin: 2700
      button_10:
        icon: mdi:thermometer?fg=FFE4CE
        tooltip: "{translate: neutral_white} 4000 K"
        config:
          - action: light.turn_on
            data:
              color_temp_kelvin: 4000
      button_11:
        icon: mdi:thermometer-high?fg=CCDDFF
        tooltip: "{translate: daylight} 6500 K"
        config:
          - action: light.turn_on
            data:
              color_temp_kelvin: 6500

      button_12:
        icon: mdi:power?fg=off
        tooltip: {translate: "off"}
        config:
          - action: light.turn_off

      button_power:
        icon: mdi:power
        tooltip: {translate: "off"}
        config:
          - action: light.turn_off
