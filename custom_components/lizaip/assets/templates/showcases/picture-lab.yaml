# Picture lab — what one image field can draw
#
# Every tile is a different trick of the image field; its tooltip names the
# option at work, and the panel's Image field shows the exact value to copy. A
# tooltip cannot hold that value verbatim -- it takes the same schemes, so
# `logo:spotify` there would draw the logo again. No device is needed.
#
#   1      a brand logo in its own colours
#   2      the same logo tinted to one colour with `?fg=`
#   3      words on a background with `?bg=`
#   4      words sized by hand with `?font_size=`
#   5-7    the three state colours: `fg=on`, `fg=off`,
#          `fg=unavailable`
#   8      a fill level with `?percent=`
#   9      two marks sharing one tile
#   10     a mark with words under it (stacked on a square tile)
#   11     a hex tint, eight digits -- the last two are transparency
#   12     a live value beside an icon: the sun's elevation, which every Home
#          Assistant has
#
#

version: 2
name: "Picture lab"
icon: mdi:palette-swatch-variant
description: Logos, tints, backgrounds, state colours and fill levels side by side

# Bound to nothing: every tile here is a fixed picture, so the page is added
# straight away, without asking for a device.

pages:
  picture-lab:
    title: "logo:hue mdi:palette text:Picture lab"
    buttons:
      button_1:
        icon: logo:spotify
        tooltip: Logo in brand colours
      button_2:
        icon: logo:spotify?fg=yellow
        tooltip: Logo tinted with fg=yellow
      button_3:
        icon: text:Hi?bg=blue
        tooltip: Words on bg=blue
      button_4:
        icon: text:Big?font_size=40
        tooltip: Words at font_size=40

      button_5:
        icon: mdi:power?fg=on
        tooltip: State colour fg=on
      button_6:
        icon: mdi:power?fg=off
        tooltip: State colour fg=off
      button_7:
        icon: mdi:power?fg=unavailable
        tooltip: State colour fg=unavailable
      button_8:
        icon: mdi:battery?percent=30
        tooltip: Fill level percent=30

      button_9:
        icon: mdi:play mdi:pause
        tooltip: Two icons sharing a tile
      button_10:
        icon: mdi:sofa Lounge
        tooltip: An icon with words under it
      button_11:
        icon: mdi:heart?fg=FF2D5580
        tooltip: Half-transparent tint fg=FF2D5580

      button_12:
        icon: "mdi:white-balance-sunny ${round(sun.sun.elevation)}°"
        tooltip: "Sun ${round(sun.sun.elevation)}° above the horizon"
