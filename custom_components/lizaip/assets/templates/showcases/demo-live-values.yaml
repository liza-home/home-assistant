# Demo: live values on a remote — every way a tile can show one
#
# Taken from page 6 of the test remote ("live demo"), so the page the template
# builds is the page the feature is tried out on. Beta builds only.
#
# What each tile demonstrates:
#
#   1  a state read straight into the tooltip, and an icon name read out of a
#      template helper (`mdi:${…}` — the helper returns the bare slug)
#   2  a `history:` graph as the picture, with a longer period as the tooltip
#   3  the same value as big text, sized with `?font_size=`
#   5  an attribute of the bound device, computed (`round(… * 100 / 255)`)
#   6  the same, on a button that also acts — the tile stays live while the
#      lamp is toggled
#   11 a second entity entirely: today's weather as both words and picture
#   12 an icon from a registered extra set, drawn in the tooltip
#
# The lamp comes from the picker: `_device` is the device the page is created
# for, so 5 and 6 follow it. The battery tiles read the *remote's* own battery,
# which is not that device, so they name two template helpers. Create them once
# under Settings > Devices & services > Helpers > Template > Sensor, replacing
# `sensor.lizaip_XXXX_battery` with this remote's battery sensor, and leave the
# unit of measurement empty on both — a unit would print as "85 %" where the
# tooltip already adds its own "%".
#
#   sensor.lizaip_battery_level — state template:
#     {{ states('sensor.lizaip_XXXX_battery') }}
#
#   sensor.lizaip_battery_icon — state template. `mdi:battery-NN` only exists
#   in steps of ten, so the level is rounded to the nearest step. The `mdi:`
#   prefix is written on the tile, not here:
#     {% set b = states('sensor.lizaip_XXXX_battery') | int(-1) %}
#     {% if b < 0 %}battery-unknown
#     {% elif b >= 95 %}battery
#     {% elif b < 5 %}battery-outline
#     {% else %}battery-{{ [[(b + 5) // 10 * 10, 10] | max, 90] | min }}
#     {% endif %}
#
# `weather.forecast_home` is Home Assistant's default weather entity. Point
# tile 11 at your own if it is named differently.
#
# A variable that is empty, unknown or unavailable collapses away, and an image
# whose variable is empty falls back to the derived icon.

version: 2
name: Demo — live values
icon: mdi:battery-heart-variant
description: Every way a tile shows a live value — state, attribute, graph, text

target_selector:
  device:
    integration: hue
    primary_domain: light

pages:
  live-values:
    title: live demo
    buttons:
      # A state in the tooltip, and an icon chosen by a template helper.
      button_1:
        icon: "mdi:${sensor.lizaip_battery_icon}"
        tooltip: "Battery ${sensor.lizaip_battery_level}%"

      # The picture is a graph. The tooltip covers a week, the tile a day, so
      # hovering widens the window rather than repeating it.
      button_2:
        icon: "history:sensor.lizaip_battery_level?hours=24"
        tooltip: "history:sensor.lizaip_battery_level?hours=168"

      # The same number as text, big enough to read across a room.
      button_3:
        icon: "text:${sensor.lizaip_battery_level}?font_size=24"
        tooltip: "history:sensor.lizaip_battery_level?hours=168"

      # An attribute of the bound lamp, turned from 0-255 into a percentage.
      button_5:
        icon: "text:${round(_device.brightness * 100 / 255)}%"
        tooltip: "Brightness ${round(_device.brightness * 100 / 255)}%"

      # The same reading on a button that acts: toggling the lamp changes the
      # value the tile prints, which is the point of the pair.
      button_6:
        icon: mdi:lightbulb
        tooltip: "Brightness ${round(_device.brightness * 100 / 255)}%"
        config:
          - action: light.toggle

      # Nothing to do with the bound device: any entity can be read.
      button_11:
        icon: "${weather.forecast_home}"
        tooltip: "${weather.forecast_home}, ${weather.forecast_home.temperature}°C"

      # An icon from a registered extra set, in the tooltip rather than on the
      # tile: the tile keeps a plain mdi: one, so the two render side by side and
      # an extra set that did not install is obvious instead of just blank.
      button_12:
        icon: mdi:account
        tooltip: "hue:pendant-devote"
