# Blank page — a page with nothing on it, offered like any other template.
#
# It sits at the root rather than in a folder, which is what puts it in front
# of them on the add-page dialog's first screen. `unbound: true` means there is
# no device to ask for, so a click adds it straight away; no buttons means the
# page arrives empty. The `_key` names point at the panel's translation table
# (`config/panel/lizaip-i18n.js`), so it keeps the five translations the
# hard-coded card already had.

name_key: blank_page
description_key: configure_manually
icon: mdi:file-plus-outline
# The card's mark only, not the page's: a blank page reaches the remote with
# nothing on it, the way the hard-coded option left it.
page_image: ""
unbound: true
