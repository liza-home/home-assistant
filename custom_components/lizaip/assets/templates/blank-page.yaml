# Blank page — a page with nothing on it, offered like any other template.
#
# It sits at the root rather than in a folder, which is what puts it in front
# of them on the add-page dialog's first screen. No `target_selector` means there
# is no device to ask for, so a click adds it straight away; no `pages:` means
# one empty page with no title. The `translate:` keys point at the panel's translation table
# (`config/panel/lizaip-i18n.js`), so it keeps the five translations the
# hard-coded card already had.

version: 2
name: {translate: blank_page}
description: {translate: configure_manually}
icon: mdi:file-plus-outline
