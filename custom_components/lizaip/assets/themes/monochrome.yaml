# lizaIP — Monochrome. Greyscale only. The swatches the editor offers are all
# grey, as is what an ordinary tile draws in; a button someone coloured by
# hand keeps that colour, since `fg=blue` means the built-in blue everywhere.
name: Monochrome

colors:
  palette:
    - { name: white, hex: "FFFFFF" }
    - { name: yellow, hex: "D6D6D6" }
    - { name: blue, hex: "AFAFAF" }
    - { name: green, hex: "8C8C8C" }
    - { name: red, hex: "E8E8E8" }
    - { name: inactive, hex: "3A3A3A" }

  # Without colour the only thing separating on from off is brightness, so an
  # off tile sits almost at the background and the gap does the work.
  states:
    "on": "FFFFFF"
    "off": "3A3A3A"
    unavailable: "8A8A8A"
    default: "FFFFFF"

# Smaller, lighter text to match the hairline glyphs.
text:
  title: { font: filsonsoft-light, font_size: 44 }
  tooltip: { font: filsonsoft-light, font_size: 22 }

# Outline glyphs read better without colour to separate them. Merged over
# the default theme's icons one entry at a time; every row left out is kept.
# Like every icons: block these show the NEXT state.
icons:
  domain_state_icons:
    light:
      "on": mdi:lightbulb-on-outline
      "off": mdi:lightbulb-outline
    switch:
      "on": mdi:toggle-switch-outline
      "off": mdi:toggle-switch-off-outline
    lock:
      locked: mdi:lock-outline
      unlocked: mdi:lock-open-outline
    fan:
      "on": mdi:fan
      "off": mdi:fan-off
    cover:
      open: mdi:arrow-down-bold-outline
      closed: mdi:arrow-up-bold-outline
    media_player:
      playing: mdi:pause-circle-outline
      paused: mdi:play-circle-outline
      idle: mdi:play-circle-outline
      "on": mdi:power-off
      "off": mdi:power-standby
  domain_icons:
    light: mdi:lightbulb-outline
    switch: mdi:toggle-switch-outline
    lock: mdi:lock-outline
    media_player: mdi:play-circle-outline
    scene: mdi:palette-outline
    script: mdi:script-text-outline
    automation: mdi:robot-outline
    camera: mdi:cctv
    humidifier: mdi:air-humidifier
