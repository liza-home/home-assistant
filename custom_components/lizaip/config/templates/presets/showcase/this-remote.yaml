# This remote — its own battery, charge and firmware, on its own face
#
# Bound to nothing, and needs nothing: every lizaIP remote reports its battery,
# whether it is charging or in a hand, its address and its firmware. When the
# page is added it looks up *this* remote's sensors (`@remote_entry` is the
# remote the page is for) and writes their ids into the tiles, so the values
# below follow the remote you are holding. After that the tiles are ordinary
# values: edit one in the panel to point it at anything else.
#
#   1      the battery level beside its icon (stacked on a square tile)
#   2      the same level as a fill: `?percent=` takes a calculation
#   3      an icon picked by arithmetic -- battery icons only exist in steps
#          of ten, so the level is rounded into one, no template helper
#   4      a day of battery history as a graph; the tooltip widens it to a week
#   5      a week of battery history
#   6      whether it is charging, read from a binary sensor
#   7      whether it is in a hand right now -- pick it up and watch
#   8      its network address, as words made to fit the tile
#   9      the firmware it runs, an attribute of an update entity; the
#          tooltip compares it with the newest one
#   10     the level as big text with `%` added by hand: a calculation reads
#          a bare number, without its unit
#   11     the level against a full charge in words, worked out live
#   12     the level as a pie of eight slices: arithmetic maps 0-100 %
#          onto circle-slice-1 ... -8

name: "This remote"
icon: mdi:remote
page_image: "mdi:remote text:This remote"
description: The remote's own battery, charge, address and firmware — values, fill levels and history
unbound: true

placeholders:
  battery:
    source: entities
    spec: {config_entry: "@remote_entry", translation_key: battery}
  charging:
    source: entities
    spec: {config_entry: "@remote_entry", translation_key: charging}
  in_hand:
    source: entities
    spec: {config_entry: "@remote_entry", translation_key: in_hand}
  address:
    source: entities
    spec: {config_entry: "@remote_entry", translation_key: ip_address}
  firmware:
    source: entities
    spec: {config_entry: "@remote_entry", translation_key: firmware}

buttons:
  button_1:
    label: "Battery ${{@battery[1].entity_id}}"
    image: "mdi:battery ${{@battery[1].entity_id}}"
  button_2:
    label: "Battery as a fill level"
    image: "mdi:battery-outline?percent=${round({@battery[1].entity_id})}"
  button_3:
    label: "An icon picked by arithmetic"
    image: "mdi:battery-${max(10, min(90, round({@battery[1].entity_id} / 10) * 10))}"
  button_4:
    label: "history:{@battery[1].entity_id}?hours=168"
    image: "history:{@battery[1].entity_id}?hours=24"
  button_5:
    label: "Battery, last week"
    image: "history:{@battery[1].entity_id}?hours=168"

  button_6:
    label: "Charging: ${{@charging[1].entity_id}}"
    image: mdi:battery-charging
  button_7:
    label: "In hand: ${{@in_hand[1].entity_id}}"
    image: mdi:hand-back-right
  button_8:
    label: "Address ${{@address[1].entity_id}}"
    image: "text:${{@address[1].entity_id}}"
  button_9:
    label: "Firmware ${{@firmware[1].entity_id}.installed_version}, newest ${{@firmware[1].entity_id}.latest_version}"
    image: "mdi:chip ${{@firmware[1].entity_id}.installed_version}"

  button_10:
    label: "Battery ${round({@battery[1].entity_id})}%"
    image: "text:${round({@battery[1].entity_id})}%"
  button_11:
    label: "${100 - round({@battery[1].entity_id})}% short of a full charge"
    image: "text:-${100 - round({@battery[1].entity_id})}%?font_size=24"
  button_12:
    label: "Battery ${round({@battery[1].entity_id})}% as a pie"
    image: "mdi:circle-slice-${max(1, min(8, 1 + round({@battery[1].entity_id} * 7 / 100)))}"
