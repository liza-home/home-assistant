# Media wall — a player's state as pictures
#
# Pick any media player. Everything follows it through `${_device…}`.
#
#   1, 2, 5, 6  the cover of what is playing, spread over a 2x2 block: scaled
#               to 120x124 with `size=` and cut into 60x62 pieces with `box=`
#   3           the volume as a fill level: `?percent=` takes a calculation,
#               so the speaker icon fills as the volume rises
#   4           how far into the track, the same way, from two attributes
#   7           the artist as words; the tooltip names the album
#   8           two marks sharing one tile (`mdi:play mdi:pause`), and a
#               tooltip mixing `${_state}` with the title
#   9, 11       previous and next, each tooltip naming the track the press
#               lands on (Sonos only -- empty elsewhere)
#   10          the source, drawn as text
#   12          a mark with words under it: a single icon followed by words is
#               stacked on a square button
#
# The fill levels follow attribute changes the player reports; most players
# report the position only when the state changes, so 4 is not a running
# clock.

name: "Media wall"
icon: mdi:image-multiple
page_image: "mdi:speaker ${_device} ${round(_device.volume_level * 100)}%"
description: Cover art over four buttons, volume and progress as fill levels

target_selector:
  device:
    integration: sonos
    primary_domain: media_player

buttons:
  # `box=x,y,w,h` in the 120x124 picture.
  button_1:
    label: "${_device.media_artist}: ${_device.media_album_name}"
    image: "${_device.entity_picture}?size=120x124&box=0,0,60,62"
  button_2:
    label: "${_device.media_artist}: ${_device.media_album_name}"
    image: "${_device.entity_picture}?size=120x124&box=60,0,60,62"
  button_5:
    label: "${_device.media_artist}: ${_device.media_album_name}"
    image: "${_device.entity_picture}?size=120x124&box=0,62,60,62"
  button_6:
    label: "${_device.media_artist}: ${_device.media_album_name}"
    image: "${_device.entity_picture}?size=120x124&box=60,62,60,62"

  button_3:
    label: "Volume ${round(_device.volume_level * 100)}%"
    action_name: Volume Up
    image: "mdi:volume-high?percent=${round(_device.volume_level * 100)}"
    config:
      - action: media_player.volume_up

  button_4:
    label: "${round(_device.media_position * 100 / _device.media_duration)}% of ${round(_device.media_duration / 60)} min"
    image: "mdi:progress-clock?percent=${round(_device.media_position * 100 / _device.media_duration)}"

  button_7:
    label: "${_device.media_album_name}"
    image: "text:${_device.media_artist}"

  button_8:
    label: "${_state} - ${_device.media_title}"
    action_name: Play/Pause
    image: mdi:play mdi:pause
    config:
      - action: media_player.media_play_pause

  button_9:
    label: "${_device.media_title_prev}"
    action_name: Previous
    image: mdi:skip-previous
    config:
      - action: media_player.media_previous_track
  button_11:
    label: "${_device.media_title_next}"
    action_name: Next
    image: mdi:skip-next
    config:
      - action: media_player.media_next_track

  button_10:
    label: "Source ${_device.source}"
    image: "text:${_device.source}"

  button_12:
    label: "${_device} · ${_device.area_name}"
    image: "mdi:speaker ${_device.area_name}"

  button_volume_up:
    label: Volume Up
    repeat: true
    image: mdi:volume-plus
    config:
      - action: media_player.volume_up

  button_volume_down:
    label: Volume Down
    repeat: true
    image: mdi:volume-minus
    config:
      - action: media_player.volume_down

  slider_vertical:
    label: Volume
    image: mdi:volume-high
    slider_actions:
      mode: proportional
      attribute: volume_level
      service: media_player.volume_set
      data_key: volume_level
      factor: 1.0
      min: 0.0
      max: 1.0
