# Picture lab — what one image field can draw
#
# Every tile is a different trick of the image field; its tooltip names the
# option at work, and the panel's Image field shows the exact value to copy. A
# tooltip cannot hold that value verbatim -- it takes the same schemes, so
# `logo:spotify` there would draw the logo again. No device is needed.
#
#   1      a brand logo in its own colours
#   2      the same logo tinted to one colour with `?fg=`
#   3      words on a background with `?bg=`
#   4      words sized by hand with `?font_size=`
#   5-7    the three state colours: `fg=enabled`, `fg=disabled`,
#          `fg=unavailable`
#   8      a fill level with `?percent=`
#   9      two marks sharing one tile
#   10     a mark with words under it (stacked on a square tile)
#   11     a hex tint, eight digits -- the last two are transparency
#   12     a live value beside an icon: the sun's elevation, which every Home
#          Assistant has
#
#

name: "Picture lab"
icon: mdi:palette-swatch-variant
page_image: "logo:hue mdi:palette text:Picture lab"
description: Logos, tints, backgrounds, state colours and fill levels side by side

# Bound to nothing: every tile here is a fixed picture, so the page is added
# straight away, without asking for a device.
unbound: true

buttons:
  button_1:
    label: Logo in brand colours
    image: logo:spotify
  button_2:
    label: Logo tinted with fg=yellow
    image: logo:spotify?fg=yellow
  button_3:
    label: Words on bg=blue
    image: text:Hi?bg=blue
  button_4:
    label: Words at font_size=40
    image: text:Big?font_size=40

  button_5:
    label: State colour fg=enabled
    image: mdi:power?fg=enabled
  button_6:
    label: State colour fg=disabled
    image: mdi:power?fg=disabled
  button_7:
    label: State colour fg=unavailable
    image: mdi:power?fg=unavailable
  button_8:
    label: Fill level percent=30
    image: mdi:battery?percent=30

  button_9:
    label: Two icons sharing a tile
    image: mdi:play mdi:pause
  button_10:
    label: An icon with words under it
    image: mdi:sofa Lounge
  button_11:
    label: Half-transparent tint fg=FF2D5580
    image: mdi:heart?fg=FF2D5580

  button_12:
    label: "Sun ${round(sun.sun.elevation)}° above the horizon"
    image: "mdi:white-balance-sunny ${round(sun.sun.elevation)}°"
