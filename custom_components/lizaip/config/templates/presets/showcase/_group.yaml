# Showcase group — the add-page option that shows off what a tile can do.
#
# `scope: option` makes this folder a button on the add-page dialog's first
# screen rather than a card inside the picker; only a folder directly under
# `presets/` can ask for it. The `_key` names point at the panel's translation
# table (`config/panel/lizaip-i18n.js`), so the option keeps its five
# translations instead of spelling one language here.

name_key: showcase_pages
description_key: showcase_pages_desc
icon: mdi:star-shooting-outline
scope: option
