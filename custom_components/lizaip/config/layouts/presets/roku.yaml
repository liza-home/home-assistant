name: Roku
icon: mdi:television-play
description: Control your Roku player or Roku TV

# Device selector — the picker offers devices of this integration that
# expose a 'remote' entity, which is what this layout's actions run on.
target_selector:
  device:
    integration: roku
    primary_domain: remote

# Button mappings (Liza button_key → HA action), written the way a stored
# page writes a button. Leave one out for a slot that should do nothing.
buttons:
  button_power:
    label: Power
    image: mdi:power
    config:
      - action: remote.send_command
        data:
          command: Power

  button_1:
    label: Home
    image: mdi:home
    config:
      - action: remote.send_command
        data:
          command: Home

  button_2:
    label: Up
    image: mdi:arrow-up
    config:
      - action: remote.send_command
        data:
          command: Up

  button_3:
    label: Back
    image: mdi:keyboard-return
    config:
      - action: remote.send_command
        data:
          command: Back

  button_4:
    label: Options
    image: mdi:asterisk
    config:
      - action: remote.send_command
        data:
          command: Info

  button_5:
    label: Left
    image: mdi:arrow-left
    config:
      - action: remote.send_command
        data:
          command: Left

  button_6:
    label: Select
    image: mdi:checkbox-marked-circle
    config:
      - action: remote.send_command
        data:
          command: Select

  button_7:
    label: Right
    image: mdi:arrow-right
    config:
      - action: remote.send_command
        data:
          command: Right

  button_8:
    label: Instant Replay
    image: mdi:replay
    config:
      - action: remote.send_command
        data:
          command: InstantReplay

  button_9:
    label: Previous
    image: mdi:skip-previous
    config:
      - action: remote.send_command
        data:
          command: Rev

  button_10:
    label: Down
    image: mdi:arrow-down
    config:
      - action: remote.send_command
        data:
          command: Down

  button_11:
    label: Next
    image: mdi:skip-next
    config:
      - action: remote.send_command
        data:
          command: Fwd

  button_12:
    label: Play / Pause
    image: mdi:play-pause
    config:
      - action: remote.send_command
        data:
          command: Play

  # --- back & voice ---
  button_back:
    label: Back
    image: mdi:arrow-left-circle
    config:
      - action: remote.send_command
        data:
          command: Back

  button_voice:
    label: Search
    image: mdi:magnify
    config:
      - action: remote.send_command
        data:
          command: Search
