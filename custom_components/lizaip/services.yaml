# Service *schemas* only. The user-facing `name:` and `description:` for each
# service and field live in `strings.json` / `translations/<lang>.json`, per
# Home Assistant's custom integration localization. They used to be duplicated
# here in English, which is what HA rendered for every user whatever their
# language — the translations existed and were never reached.
#
# Keep this file to what cannot be translated: which fields exist, whether they
# are required, and how HA should render their input.

firmware_update:
  fields:
    url:
      required: true
      example: "https://example.com/lizaip-firmware-1.2.3.bin"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: lizaip

clear_device_pages:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: lizaip

launch_app:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
          multiple: true
    app_id:
      required: true
      example: "3201907018807"
      selector:
        text:

refresh_dynamic_sources:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: lizaip

goto_page:
  # All three keys are needed, and dropping any one fails silently: without
  # `device` the action is not offered on the lizaIP device, without `entity`
  # core's matcher accepts every entity, and without `primary_entities_only`
  # it skips the remote's entities (all of them have an entity category).
  target:
    entity:
      integration: lizaip
    device:
      integration: lizaip
    primary_entities_only: false
  # The page is named by its id, not its title: titles are duplicable and get
  # renamed, and the id is what the protocol carries. `page` is still accepted
  # by the schema so automations written against the old field keep working, it
  # is simply no longer offered here.
  fields:
    page_id:
      required: true
      example: 2
      selector:
        number:
          min: 1
          mode: box

send_ir:
  # Same three target keys as goto_page, for the same reasons.
  target:
    entity:
      integration: lizaip
    device:
      integration: lizaip
    primary_entities_only: false
  fields:
    ir_blob:
      required: true
      example: "aGFsbG93ZWx0"
      selector:
        text:
